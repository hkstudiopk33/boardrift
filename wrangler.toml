name = "boardrift"
main = "worker.js"
compatibility_date = "2025-06-01"

# The website (public/index.html) and the online room server are served by this one Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
